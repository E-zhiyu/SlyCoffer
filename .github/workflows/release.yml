name: Sly's Coffer Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: gradle

      # 从 Secrets 还原签名文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 构建已签名的分包 APK
      - name: Build Signed APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 批量重命名分包后的所有 APK (例如：Sly.s-Coffer_arm64-v8a_v1.0.0.apk)
      - name: Rename Split APKs
        run: |
          APP_NAME="Sly.s-Coffer"
          TAG_NAME="${{ github.ref_name }}"
          
          cd app/build/outputs/apk/release/
          for file in *.apk; do
            if [ -f "$file" ]; then
              # 将 app-<abi>-release.apk 替换为 <APP_NAME>_<TAG_NAME>_<abi>.apk
              NEW_NAME=$(echo "$file" | sed "s/^app-/${APP_NAME}_${TAG_NAME}_/" | sed "s/-release\.apk$/.apk/")
              mv "$file" "$NEW_NAME"
            fi
          done

      # 解析更新日志文件
      - name: Extract Changelog
        id: extract_changelog
        run: |
          VERSION="${{ github.ref_name }}"
          START_LINE=$(grep -nE "^# $VERSION" CHANGELOG.md | cut -d: -f1)

          if [ -z "$START_LINE" ]; then
            echo "未在 CHANGELOG.md 中找到版本 $VERSION 的记录"
            echo "No changelog found for $VERSION" > current_release_notes.md
          else
            tail -n +$((START_LINE + 1)) CHANGELOG.md | sed -n '/^# /q;p' > current_release_notes.md
          fi

      # 发布到 GitHub Release (使用通配符匹配上传所有重命名后的分包文件)
      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          body_path: current_release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}